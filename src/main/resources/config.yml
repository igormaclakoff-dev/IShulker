# ============================================================
#  IShulker  —  от AuraCode
# ============================================================
#  Открывайте шалкеры прямо из руки: зажмите Shift и нажмите
#  ПКМ по воздуху, держа шалкер в главной руке. Шалкер при этом
#  не ставится на землю — открывается его содержимое.
#
#  Перезагрузить: /ishulker reload
#
#  Плагин использует MiniMessage.
#  HEX:       <#8A5CF6>текст</#8A5CF6>
#  Градиент:  <gradient:#8A5CF6:#FF7000>текст</gradient>
#  Жирный:    <bold>текст</bold>
# ============================================================

# Включена ли функция.
# Можно переключить прямо в игре: /ishulker on|off
# Значение из этого файла применяется при запуске и при /ishulker reload.
enabled: true

# ============================================================
#  ПОВЕДЕНИЕ
# ============================================================
settings:
  # Требовать зажатый Shift для открытия шалкера.
  require-sneak: true

  # Открывать только при нажатии ПКМ по воздуху (не по блоку).
  # Если false — ПКМ по блоку тоже откроет шалкер вместо установки.
  open-on-air-only: true

  # Право на открытие шалкера из руки.
  # Оставьте пустым (""), чтобы разрешить всем.
  permission: "ishulker.use"

  # Запрещать складывать шалкеры внутрь открытого шалкера
  # (как в ваниле) и перемещать открытый шалкер из руки.
  prevent-nesting: true

  # Автоматически сохранять содержимое открытого шалкера
  # обратно в предмет. Значение — период в тиках (20 тиков = 1 сек).
  # Защищает от потери/дюпа при внезапном падении сервера.
  autosave-interval-ticks: 20

# ============================================================
#  СООБЩЕНИЯ
# ============================================================
messages:
  no-permission: "<red>◆</red> <gray>У вас нет доступа.</gray>"
  enabled: "<green>◆</green> <gray>IShulker <white>включён</white>.</gray>"
  disabled: "<red>◆</red> <gray>IShulker <white>выключен</white>.</gray>"
  status-enabled: "<green>◆</green> <gray>IShulker сейчас <white>включён</white>.</gray>"
  status-disabled: "<red>◆</red> <gray>IShulker сейчас <white>выключен</white>.</gray>"
  reloaded: "<#8A5CF6>◆</#8A5CF6> <gray>Конфигурация IShulker перезагружена.</gray>"
  usage: "<red>◆</red> <gray>Использование: <white>/ishulker <on|off|toggle|reload|status|help|version></white></gray>"
